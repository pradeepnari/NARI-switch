<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NARI Smart Switch</title>
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(26, 34, 53, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #0284c7;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 60px 16px; }
    
    header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
    .brand i { font-size: 1.4rem; }
    
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
    
    /* Device Card */
    .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); transition: transform 0.2s; }
    .card:active { transform: scale(0.99); }
    .dev-left { display: flex; align-items: center; gap: 16px; }
    .icon-box { width: 48px; height: 48px; border-radius: 12px; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--text-muted); transition: 0.3s; }
    .icon-box.active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .dev-info h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 3px; }
    .dev-info p { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); display: inline-block; }
    .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
    
    .dev-actions { display: flex; align-items: center; gap: 14px; }
    
    /* Toggle Button */
    .btn-toggle { min-width: 65px; padding: 9px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .btn-off { background: #334155; color: #94a3b8; }
    .btn-on { background: var(--success); color: white; }

    .btn-del { background: transparent; border: none; color: var(--danger); font-size: 1.25rem; cursor: pointer; transition: 0.2s; padding: 4px 6px; }
    .btn-del:hover { opacity: 0.8; }

    /* Add Card Panel */
    .add-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .add-panel h4 { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 4px; }
    .input-group { display: flex; gap: 10px; }
    input { background: #0b1120; border: 1px solid var(--border); color: white; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; flex: 1; outline: none; transition: 0.2s; }
    input:focus { border-color: var(--primary); }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(2,132,199,0.3); }
    .btn-primary:active { transform: scale(0.98); }
    
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem; }
    .empty-state i { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-bolt"></i> NARI Smart Home
    </div>
    <div style="font-size: 0.8rem; color: var(--text-muted);">Universal Hub</div>
  </header>

  <div class="container" id="deviceList"></div>

  <div class="container">
    <div class="add-panel">
      <h4><i class="fa-solid fa-plus-circle"></i> Add New Switch</h4>
      <input type="text" id="devName" placeholder="Appliance Name (e.g. Hall Light)">
      <div class="input-group">
        <input type="text" id="devIp" placeholder="ESP Local IP (e.g. 192.168.1.10)">
      </div>
      <button class="btn-primary" onclick="addDevice()">Pair Device</button>
    </div>
  </div>

  <script>
    let devices = JSON.parse(localStorage.getItem("nari_devices") || "[]");

    function save() {
      localStorage.setItem("nari_devices", JSON.stringify(devices));
      render();
    }

    function render() {
      const list = document.getElementById("deviceList");
      list.innerHTML = "";

      if (devices.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-house-signal"></i>
            <p>No devices paired yet.<br>Pair a device below using its assigned IP.</p>
          </div>
        `;
        return;
      }

      devices.forEach((dev, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="dev-left">
            <div class="icon-box ${dev.state ? 'active' : ''}">
              <i class="fa-solid ${dev.state ? 'fa-lightbulb' : 'fa-power-off'}"></i>
            </div>
            <div class="dev-info">
              <h3>${dev.name}</h3>
              <p><span class="status-dot online"></span> ${dev.ip}</p>
            </div>
          </div>
          <div class="dev-actions">
            <button class="btn-toggle ${dev.state ? 'btn-on' : 'btn-off'}" onclick="toggleDevice(${index})">
              ${dev.state ? 'ON' : 'OFF'}
            </button>
            <button class="btn-del" title="Reset & Remove" onclick="deleteDevice(${index})">
              ✕
            </button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function addDevice() {
      const name = document.getElementById("devName").value.trim();
      const ip = document.getElementById("devIp").value.trim();
      if (!name || !ip) return alert("Please enter both Appliance Name and ESP IP address.");

      devices.push({ name, ip, state: false });
      document.getElementById("devName").value = "";
      document.getElementById("devIp").value = "";
      save();
      syncDevice(devices.length - 1);
    }

    function toggleDevice(index) {
      const dev = devices[index];
      dev.state = !dev.state;
      save();

      fetch(`http://${dev.ip}/toggle?state=${dev.state ? 1 : 0}`, { mode: 'cors' })
        .catch(() => alert(`Device unreachable: ${dev.name} (${dev.ip})`));
    }

    function syncDevice(index) {
      const dev = devices[index];
      fetch(`http://${dev.ip}/status`, { mode: 'cors' })
        .then(r => r.json())
        .then(data => {
          dev.state = data.state;
          save();
        })
        .catch(() => {});
    }

    function deleteDevice(index) {
      const dev = devices[index];
      const confirmReset = confirm(`Reset and remove "${dev.name}"?\n\nThis will wipe its Wi-Fi settings, restart the module, and make it visible in your phone's Wi-Fi list for re-pairing.`);
      
      if (confirmReset) {
        // Send reset signal to the physical ESP hardware
        fetch(`http://${dev.ip}/resetwifi`, { mode: 'cors' })
          .catch(() => console.log("Reset command dispatched."));

        // Remove from web dashboard
        devices.splice(index, 1);
        save();

        alert(`${dev.name} is resetting! Look for 'SmartDevice-Setup' in your Wi-Fi settings in a few seconds.`);
      }
    }

    render();
    devices.forEach((_, idx) => syncDevice(idx));
  </script>
</body>
</html>
