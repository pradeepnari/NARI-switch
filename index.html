<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NARI Smart Switch</title>
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(26, 34, 53, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #0284c7;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 60px 16px; }
    
    header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .btn-add-top { background: var(--primary); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
    .btn-add-top:active { transform: scale(0.9); }

    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
    
    .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
    .dev-left { display: flex; align-items: center; gap: 16px; }
    .icon-box { width: 48px; height: 48px; border-radius: 12px; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--text-muted); }
    .icon-box.active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .dev-info h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 3px; }
    .dev-info p { font-size: 0.78rem; color: var(--text-muted); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 4px; }
    
    .dev-actions { display: flex; align-items: center; gap: 14px; }
    .btn-toggle { min-width: 65px; padding: 9px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .btn-off { background: #334155; color: #94a3b8; }
    .btn-on { background: var(--success); color: white; }
    .btn-del { background: transparent; border: none; color: var(--danger); font-size: 1.25rem; cursor: pointer; padding: 4px; }

    /* Modal Styling */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-box { background: #1a2235; border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 380px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: bold; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    input { background: #090d16; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; font-size: 0.9rem; outline: none; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .scan-status { font-size: 0.82rem; color: var(--accent); text-align: center; display: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fa-solid fa-bolt"></i> NARI Smart Home</div>
    <button class="btn-add-top" onclick="openModal()" title="Add Device"><i class="fa-solid fa-plus"></i></button>
  </header>

  <div class="container" id="deviceList"></div>

  <!-- Pair Modal -->
  <div class="modal-overlay" id="pairModal">
    <div class="modal-box">
      <div class="modal-header">
        <span><i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Pair Device</span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Ensure the switch is connected to home Wi-Fi via its setup portal first.</p>
      
      <input type="text" id="devName" placeholder="Appliance Name (e.g. Bedside Lamp)">
      <button class="btn-primary" id="btnScan" onclick="startScanAndPair()">Auto-Detect & Pair</button>
      <div class="scan-status" id="scanText"><i class="fa-solid fa-spinner fa-spin"></i> Scanning local network for new switch...</div>
    </div>
  </div>

  <script>
    let devices = JSON.parse(localStorage.getItem("nari_devices") || "[]");

    function save() {
      localStorage.setItem("nari_devices", JSON.stringify(devices));
      render();
    }

    function render() {
      const list = document.getElementById("deviceList");
      list.innerHTML = "";

      if (devices.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-muted);"><p>No devices added.<br>Tap <b>+</b> at the top right to pair your first device.</p></div>`;
        return;
      }

      devices.forEach((dev, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="dev-left">
            <div class="icon-box ${dev.state ? 'active' : ''}">
              <i class="fa-solid ${dev.state ? 'fa-lightbulb' : 'fa-power-off'}"></i>
            </div>
            <div class="dev-info">
              <h3>${dev.name}</h3>
              <p><span class="status-dot"></span>${dev.ip}</p>
            </div>
          </div>
          <div class="dev-actions">
            <button class="btn-toggle ${dev.state ? 'btn-on' : 'btn-off'}" onclick="toggleDevice(${index})">
              ${dev.state ? 'ON' : 'OFF'}
            </button>
            <button class="btn-del" onclick="deleteDevice(${index})">✕</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function openModal() { document.getElementById("pairModal").style.display = "flex"; }
    function closeModal() { document.getElementById("pairModal").style.display = "none"; }

    // Scans local IP range 192.168.1.2 - 192.168.1.40 for unassigned NARI switches
    async function startScanAndPair() {
      const name = document.getElementById("devName").value.trim();
      if (!name) return alert("Enter an appliance name first.");

      const scanText = document.getElementById("scanText");
      const btnScan = document.getElementById("btnScan");
      scanText.style.display = "block";
      btnScan.disabled = true;

      const registeredIPs = devices.map(d => d.ip);
      let foundIp = null;

      // Scan common home router ranges (adjust base IP if needed)
      const baseSubnet = "192.168.1.";
      const candidates = [];
      for (let i = 2; i <= 35; i++) candidates.push(`${baseSubnet}${i}`);

      for (const ip of candidates) {
        if (registeredIPs.includes(ip)) continue;

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 200); // Quick 200ms ping
          const res = await fetch(`http://${ip}/identify`, { mode: 'cors', signal: controller.signal });
          clearTimeout(timeoutId);

          const data = await res.json();
          if (data.device === "NARI-Switch") {
            foundIp = ip;
            break;
          }
        } catch (e) {
          // IP offline or unreachable
        }
      }

      scanText.style.display = "none";
      btnScan.disabled = false;

      if (foundIp) {
        devices.push({ name, ip: foundIp, state: false });
        save();
        closeModal();
        alert(`Successfully paired ${name} at ${foundIp}!`);
      } else {
        alert("No new NARI switch found on this Wi-Fi. Ensure the switch is powered on and connected to the same router.");
      }
    }

    function toggleDevice(index) {
      const dev = devices[index];
      dev.state = !dev.state;
      save();
      fetch(`http://${dev.ip}/toggle?state=${dev.state ? 1 : 0}`, { mode: 'cors' }).catch(() => {});
    }

    function deleteDevice(index) {
      const dev = devices[index];
      if (confirm(`Reset and erase Wi-Fi on ${dev.name}?`)) {
        fetch(`http://${dev.ip}/resetwifi`, { mode: 'cors' }).catch(() => {});
        devices.splice(index, 1);
        save();
      }
    }

    render();
  </script>
</body>
</html>
