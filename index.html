<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NARI Smart Switch</title>
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #141b2d;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #0284c7;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 60px 16px; }
    
    header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .btn-add-top { background: var(--primary); color: white; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }

    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
    
    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: 24px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.45); 
      cursor: pointer; 
      transition: border-color 0.2s; 
      user-select: none;
    }
    
    .card-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .dev-left { display: flex; align-items: center; gap: 14px; }
    .icon-box { width: 48px; height: 48px; border-radius: 14px; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: var(--text-muted); }
    .icon-box.active { background: rgba(16, 185, 129, 0.18); color: var(--success); }
    .dev-info h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 2px; }
    .dev-info p { font-size: 0.76rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; }
    
    .dev-actions { display: flex; align-items: center; gap: 10px; }
    .btn-toggle { min-width: 65px; padding: 10px 16px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
    .btn-off { background: #334155; color: #94a3b8; }
    .btn-on { background: var(--success); color: white; }
    .btn-del { background: transparent; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; padding: 6px; }

    .sensor-drawer { 
      margin-top: 14px; 
      padding-top: 14px; 
      border-top: 1px dashed var(--card-border); 
      display: none; 
      flex-direction: column; 
      gap: 10px; 
    }
    .sensor-drawer.open { display: flex; }
    .drawer-title { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
    select { 
      background: #090d16; 
      border: 1px solid var(--card-border); 
      color: #38bdf8; 
      padding: 10px 12px; 
      border-radius: 10px; 
      font-size: 0.85rem; 
      outline: none; 
      width: 100%; 
      cursor: pointer; 
    }
    .hint-label { font-size: 0.72rem; color: #64748b; margin-top: 4px; text-align: right; }
    
    /* Live Sound Meter */
    .meter-container { width: 100%; height: 6px; background: #090d16; border-radius: 3px; overflow: hidden; margin-top: 4px; display: none; }
    .meter-bar { width: 0%; height: 100%; background: #38bdf8; transition: width 0.05s; }
    .meter-bar.spike { background: var(--success); }
    .sensor-feedback { font-size: 0.78rem; color: #fbbf24; display: none; align-items: center; gap: 6px; font-weight: 500; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-box { background: #141b2d; border: 1px solid var(--card-border); border-radius: 22px; width: 100%; max-width: 380px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    input { background: #090d16; border: 1px solid var(--card-border); color: white; padding: 12px; border-radius: 10px; font-size: 0.9rem; outline: none; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 13px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fa-solid fa-bolt"></i> NARI Smart Home</div>
    <button class="btn-add-top" onclick="openModal()" title="Add Device"><i class="fa-solid fa-plus"></i></button>
  </header>

  <div class="container" id="deviceList"></div>

  <div class="modal-overlay" id="pairModal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Add Smart Switch</span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <input type="text" id="devName" placeholder="Appliance Name (e.g. Bed Lamp)">
      <input type="text" id="devIp" placeholder="ESP Local IP (e.g. 192.168.1.10)">
      <button class="btn-primary" onclick="addDevice()">Pair Device</button>
    </div>
  </div>

  <script>
    let devices = JSON.parse(localStorage.getItem("nari_devices") || "[]");
    let openDrawerIndex = null;
    let audioCtx = null;
    let micStream = null;
    let animFrame = null;
    let diyIntervals = {};

    function save() {
      localStorage.setItem("nari_devices", JSON.stringify(devices));
      render();
    }

    function toggleDrawer(index) {
      openDrawerIndex = openDrawerIndex === index ? null : index;
      render();
    }

    function render() {
      const list = document.getElementById("deviceList");
      list.innerHTML = "";

      if (devices.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-muted);"><p>No switches added.<br>Tap <b>+</b> at the top right to pair one.</p></div>`;
        return;
      }

      devices.forEach((dev, index) => {
        const isOpen = openDrawerIndex === index;
        const card = document.createElement("div");
        card.className = "card";
        
        card.onclick = (e) => {
          if (e.target.closest('.dev-actions') || e.target.closest('.sensor-drawer')) return;
          toggleDrawer(index);
        };

        card.innerHTML = `
          <div class="card-main">
            <div class="dev-left">
              <div class="icon-box ${dev.state ? 'active' : ''}">
                <i class="fa-solid ${dev.state ? 'fa-lightbulb' : 'fa-power-off'}"></i>
              </div>
              <div class="dev-info">
                <h3>${dev.name}</h3>
                <p><span class="status-dot"></span>${dev.ip}</p>
              </div>
            </div>
            <div class="dev-actions">
              <button class="btn-toggle ${dev.state ? 'btn-on' : 'btn-off'}" onclick="event.stopPropagation(); toggleDevice(${index});">
                ${dev.state ? 'ON' : 'OFF'}
              </button>
              <button class="btn-del" onclick="event.stopPropagation(); deleteDevice(${index});">✕</button>
            </div>
          </div>

          <div class="hint-label">${isOpen ? '▲ Collapse options' : '▼ Tap card to open AI & sensor modes'}</div>
          
          <div class="sensor-drawer ${isOpen ? 'open' : ''}">
            <div class="drawer-title">
              <i class="fa-solid fa-brain"></i> Trigger & Audio Modes
            </div>
            <select onclick="event.stopPropagation();" onchange="handleModeChange(${index}, this.value)">
              <option value="none" selected>Standard Manual Mode</option>
              <option value="clap">Acoustic: Double Clap Engine</option>
              <option value="shake">Gesture: Shake Phone (Acc > 11g)</option>
              <option value="wrist">Gesture: Wrist Flick (Gyro/Tilt)</option>
              <option value="voice">Voice: "Lights ON" / "Lights OFF"</option>
              <option value="flicker">DIY: Auto-Strobe Cycle (500ms)</option>
            </select>
            <div class="meter-container" id="meter-box-${index}">
              <div class="meter-bar" id="meter-bar-${index}"></div>
            </div>
            <div class="sensor-feedback" id="feedback-${index}">
              <i class="fa-solid fa-microphone-lines fa-fade"></i> <span>Ready</span>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function openModal() { document.getElementById("pairModal").style.display = "flex"; }
    function closeModal() { document.getElementById("pairModal").style.display = "none"; }

    function addDevice() {
      const name = document.getElementById("devName").value.trim();
      const ip = document.getElementById("devIp").value.trim();
      if (!name || !ip) return alert("Fill in both fields.");
      devices.push({ name, ip, state: false });
      save();
      closeModal();
    }

    function sendCommand(index, state) {
      const dev = devices[index];
      dev.state = state;
      save();
      if (navigator.vibrate) navigator.vibrate(60);
      fetch(`http://${dev.ip}/toggle?state=${state ? 1 : 0}`, { mode: 'cors' }).catch(() => {});
    }

    function toggleDevice(index) {
      sendCommand(index, !devices[index].state);
    }

    function deleteDevice(index) {
      const dev = devices[index];
      if (confirm(`Reset and erase Wi-Fi on ${dev.name}?`)) {
        fetch(`http://${dev.ip}/resetwifi`, { mode: 'cors' }).catch(() => {});
        devices.splice(index, 1);
        save();
      }
    }

    // --- SENSOR & ACOUSTIC HANDLER ---
    async function handleModeChange(index, mode) {
      const feedback = document.getElementById(`feedback-${index}`);
      const meterBox = document.getElementById(`meter-box-${index}`);
      const meterBar = document.getElementById(`meter-bar-${index}`);
      
      window.ondevicemotion = null;
      if (diyIntervals[index]) clearInterval(diyIntervals[index]);
      if (animFrame) cancelAnimationFrame(animFrame);

      if (meterBox) meterBox.style.display = "none";

      if (mode === "none") {
        if (feedback) feedback.style.display = "none";
        return;
      }
      if (feedback) feedback.style.display = "flex";

      // 1. Calibrated Double Clap Engine
      if (mode === "clap") {
        try {
          feedback.querySelector("span").innerText = "Activating microphone...";
          meterBox.style.display = "block";
          
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') await audioCtx.resume();
          
          if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }

          const source = audioCtx.createMediaStreamSource(micStream);

          // Bandpass / High-Pass tuned to 800Hz to eliminate speech base while allowing full clap impulse
          const filter = audioCtx.createBiquadFilter();
          filter.type = "highpass";
          filter.frequency.setValueAtTime(800, audioCtx.currentTime);

          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          source.connect(filter);
          filter.connect(analyser);

          feedback.querySelector("span").innerText = "Listening for Double Clap (👏 .. 👏)...";

          const buffer = new Uint8Array(analyser.fftSize);
          let firstClapTime = 0;
          let isWaitingForSecond = false;
          let armed = true;

          function processClap() {
            analyser.getByteTimeDomainData(buffer);

            // Compute peak excursion
            let peak = 0;
            for (let i = 0; i < buffer.length; i++) {
              const diff = Math.abs(buffer[i] - 128);
              if (diff > peak) peak = diff;
            }

            // Update live visual sound meter
            const visualPct = Math.min(100, (peak / 60) * 100);
            if (meterBar) {
              meterBar.style.width = `${visualPct}%`;
              meterBar.className = peak > 25 ? 'meter-bar spike' : 'meter-bar';
            }

            const now = Date.now();

            // Calibrated Clap Threshold (> 25)
            if (peak > 25 && armed) {
              armed = false;

              if (!isWaitingForSecond) {
                isWaitingForSecond = true;
                firstClapTime = now;
                feedback.querySelector("span").innerText = "👏 1st Clap heard! Clap once more...";
                
                // 150ms dead-time so echo doesn't trigger 2nd clap instantly
                setTimeout(() => { armed = true; }, 150);
              } else {
                const delta = now - firstClapTime;
                // Double Clap Window: 150ms to 900ms
                if (delta >= 150 && delta <= 900) {
                  feedback.querySelector("span").innerText = "✓ Double Clap Confirmed!";
                  toggleDevice(index);
                  
                  isWaitingForSecond = false;
                  setTimeout(() => {
                    armed = true;
                    if (feedback) feedback.querySelector("span").innerText = "Listening for Double Clap (👏 .. 👏)...";
                  }, 1200);
                }
              }
            }

            // Timeout: Reset if second clap doesn't arrive within 900ms
            if (isWaitingForSecond && (now - firstClapTime > 900)) {
              isWaitingForSecond = false;
              armed = true;
              feedback.querySelector("span").innerText = "Listening for Double Clap (👏 .. 👏)...";
            }

            // Reset armed state when room is quiet
            if (!armed && peak < 10 && !isWaitingForSecond) {
              armed = true;
            }

            animFrame = requestAnimationFrame(processClap);
          }
          processClap();

        } catch (err) {
          alert("Microphone permission denied. Allow microphone in your browser settings.");
          if (feedback) feedback.style.display = "none";
        }
      }

      // 2. Shake Gesture
      else if (mode === "shake") {
        feedback.querySelector("span").innerText = "Shake phone to toggle";
        let lastShake = 0;
        window.ondevicemotion = (e) => {
          const acc = e.accelerationIncludingGravity;
          if (!acc) return;
          const force = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z) - 9.81;
          if (force > 11.0 && Date.now() - lastShake > 1500) {
            lastShake = Date.now();
            toggleDevice(index);
          }
        };
      }

      // 3. Wrist Flick Gesture
      else if (mode === "wrist") {
        feedback.querySelector("span").innerText = "Flick wrist to toggle";
        let lastFlick = 0;
        window.ondevicemotion = (e) => {
          const acc = e.acceleration;
          if (!acc) return;
          const lateral = Math.sqrt(acc.x * acc.x + acc.y * acc.y);
          if (lateral > 14.0 && Date.now() - lastFlick > 1200) {
            lastFlick = Date.now();
            toggleDevice(index);
          }
        };
      }

      // 4. Voice Commands
      else if (mode === "voice") {
        feedback.querySelector("span").innerText = "Say 'ON' or 'OFF'...";
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return alert("Speech recognition not supported in this browser.");
        const recognizer = new SpeechRecognition();
        recognizer.continuous = true;
        recognizer.lang = 'en-US';
        recognizer.onresult = (evt) => {
          const text = evt.results[evt.results.length - 1][0].transcript.toLowerCase();
          if (text.includes("on") || text.includes("light on")) sendCommand(index, true);
          else if (text.includes("off") || text.includes("light off")) sendCommand(index, false);
        };
        recognizer.start();
      }

      // 5. DIY Auto-Strobe
      else if (mode === "flicker") {
        feedback.querySelector("span").innerText = "Strobing every 500ms...";
        let st = false;
        diyIntervals[index] = setInterval(() => {
          st = !st;
          sendCommand(index, st);
        }, 500);
      }
    }

    render();
  </script>
</body>
</html>
