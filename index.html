<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Switch Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    h2 { color: #38bdf8; margin: 12px 0 20px 0; font-size: 1.4rem; }
    .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
    
    /* Device Card */
    .card { background: #1e293b; border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .details { display: flex; flex-direction: column; gap: 4px; }
    .name { font-size: 1.05rem; font-weight: 600; }
    .ip { font-size: 0.75rem; color: #94a3b8; }
    .btn-toggle { min-width: 70px; padding: 10px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-off { background: #334155; color: #94a3b8; }
    .btn-on { background: #10b981; color: white; }
    .btn-del { background: transparent; border: none; color: #ef4444; font-size: 1.2rem; cursor: pointer; margin-left: 8px; }

    /* Add Device Box */
    .add-panel { background: #1e293b; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    input { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    .btn-add { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Multi-Switch Hub</h2>

  <div class="container" id="deviceList"></div>

  <div class="container">
    <div class="add-panel">
      <input type="text" id="devName" placeholder="Appliance Name (e.g. Hall Light)">
      <input type="text" id="devIp" placeholder="ESP Local IP (e.g. 192.168.1.50)">
      <button class="btn-add" onclick="addDevice()">+ Pair New Switch</button>
    </div>
  </div>

  <script>
    let devices = JSON.parse(localStorage.getItem("my_switches") || "[]");

    function render() {
      const list = document.getElementById("deviceList");
      list.innerHTML = "";
      devices.forEach((dev, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="details">
            <span class="name">${dev.name}</span>
            <span class="ip">${dev.ip}</span>
          </div>
          <div style="display:flex; align-items:center;">
            <button class="btn-toggle ${dev.state ? 'btn-on' : 'btn-off'}" onclick="toggleDevice(${index})">
              ${dev.state ? 'ON' : 'OFF'}
            </button>
            <button class="btn-del" onclick="deleteDevice(${index})">✕</button>
          </div>
        `;
        list.appendChild(card);
      });
      localStorage.setItem("my_switches", JSON.stringify(devices));
    }

    function addDevice() {
      const name = document.getElementById("devName").value.trim();
      const ip = document.getElementById("devIp").value.trim();
      if (!name || !ip) return alert("Please fill both name and IP");

      devices.push({ name, ip, state: false });
      document.getElementById("devName").value = "";
      document.getElementById("devIp").value = "";
      render();
      syncState(devices.length - 1);
    }

    function toggleDevice(index) {
      const dev = devices[index];
      dev.state = !dev.state;
      render();

      fetch(`http://${dev.ip}/toggle?state=${dev.state ? 1 : 0}`, { mode: 'cors' })
        .catch(err => alert(`Failed to reach ${dev.name}. Check your home Wi-Fi.`));
    }

    function syncState(index) {
      const dev = devices[index];
      fetch(`http://${dev.ip}/status`, { mode: 'cors' })
        .then(r => r.json())
        .then(data => {
          dev.state = data.state;
          render();
        })
        .catch(() => {});
    }

    function deleteDevice(index) {
      devices.splice(index, 1);
      render();
    }

    render();
    devices.forEach((_, idx) => syncState(idx));
  </script>
</body>
</html>
