<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NARI Smart Switch</title>
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Standalone Core TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #141b2d;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #0284c7;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 60px 16px; }
    
    header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .btn-add-top { background: var(--primary); color: white; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }

    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
    
    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: 24px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.45); 
      cursor: pointer; 
      transition: border-color 0.2s; 
      user-select: none;
    }
    
    .card-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .dev-left { display: flex; align-items: center; gap: 14px; }
    .icon-box { width: 48px; height: 48px; border-radius: 14px; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: var(--text-muted); transition: 0.3s; }
    .icon-box.active { background: rgba(16, 185, 129, 0.18); color: var(--success); }
    .dev-info h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 2px; }
    .dev-info p { font-size: 0.76rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; }
    
    .dev-actions { display: flex; align-items: center; gap: 10px; }
    .btn-toggle { min-width: 65px; padding: 10px 16px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
    .btn-off { background: #334155; color: #94a3b8; }
    .btn-on { background: var(--success); color: white; }
    .btn-del { background: transparent; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; padding: 6px; }

    .sensor-drawer { 
      margin-top: 14px; 
      padding-top: 14px; 
      border-top: 1px dashed var(--card-border); 
      display: none; 
      flex-direction: column; 
      gap: 12px; 
    }
    .sensor-drawer.open { display: flex; }
    .drawer-title { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
    select { 
      background: #090d16; 
      border: 1px solid var(--card-border); 
      color: #38bdf8; 
      padding: 10px 12px; 
      border-radius: 10px; 
      font-size: 0.85rem; 
      outline: none; 
      width: 100%; 
      cursor: pointer; 
    }
    .hint-label { font-size: 0.72rem; color: #64748b; margin-top: 4px; text-align: right; }

    /* Confidence Output Bar */
    .meter-container { width: 100%; height: 8px; background: #090d16; border-radius: 4px; overflow: hidden; position: relative; display: none; border: 1px solid var(--card-border); }
    .meter-bar { width: 0%; height: 100%; background: #38bdf8; transition: width 0.05s ease-out; }
    .meter-threshold-line { position: absolute; top: 0; bottom: 0; left: 75%; width: 2px; background: #ef4444; }
    
    .sensor-feedback { font-size: 0.78rem; color: #fbbf24; display: none; align-items: center; gap: 8px; font-weight: 500; }
    .ai-badge { display: inline-block; padding: 2px 7px; border-radius: 6px; background: rgba(56, 189, 248, 0.15); color: var(--accent); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-box { background: #141b2d; border: 1px solid var(--card-border); border-radius: 22px; width: 100%; max-width: 380px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    input[type=text] { background: #090d16; border: 1px solid var(--card-border); color: white; padding: 12px; border-radius: 10px; font-size: 0.9rem; outline: none; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 13px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fa-solid fa-bolt"></i> NARI Smart Home</div>
    <button class="btn-add-top" onclick="openModal()" title="Add Device"><i class="fa-solid fa-plus"></i></button>
  </header>

  <div class="container" id="deviceList"></div>

  <div class="modal-overlay" id="pairModal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Add Smart Switch</span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <input type="text" id="devName" placeholder="Appliance Name (e.g. Bed Lamp)">
      <input type="text" id="devIp" placeholder="ESP Local IP (e.g. 192.168.1.10)">
      <button class="btn-primary" onclick="addDevice()">Pair Device</button>
    </div>
  </div>

  <script>
    let devices = JSON.parse(localStorage.getItem("nari_devices") || "[]");
    let openDrawerIndex = null;
    let audioCtx = null;
    let micStream = null;
    let animFrame = null;
    let diyIntervals = {};

    // --- WEIGHT TENSORS FOR ACOUSTIC CLASSIFIER ---
    const W1 = tf.tensor2d([
      [-0.6,  1.3, -0.2, -0.4, -0.7],
      [-0.9,  1.6, -0.3, -0.5, -0.8],
      [-0.4,  1.1, -0.2, -0.3, -0.6],
      [-0.2, -1.2,  1.8,  2.1,  2.3],
      [-0.3, -1.4,  1.9,  2.2,  2.4],
      [-0.5, -0.8,  1.4,  1.6,  1.8],
      [-0.4, -0.7,  1.6,  1.9,  2.1],
      [-0.6, -0.9,  1.8,  2.3,  2.5]
    ]);
    const B1 = tf.tensor1d([-0.2, 0.2, -0.4, -0.4, -0.5]);

    const W2 = tf.tensor2d([
      [ 1.8, -0.6, -1.6],
      [ 2.2, -0.7, -1.9],
      [-2.1, -1.5,  2.8],
      [-2.3, -1.7,  3.2],
      [-2.5, -1.9,  3.5]
    ]);
    const B2 = tf.tensor1d([0.1, 0.2, -0.3]);

    function saveState() {
      localStorage.setItem("nari_devices", JSON.stringify(devices));
    }

    function toggleDrawer(index) {
      openDrawerIndex = openDrawerIndex === index ? null : index;
      render();
    }

    function render() {
      const list = document.getElementById("deviceList");
      list.innerHTML = "";

      if (devices.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-muted);"><p>No switches added.<br>Tap <b>+</b> at the top right to pair one.</p></div>`;
        return;
      }

      devices.forEach((dev, index) => {
        const isOpen = openDrawerIndex === index;
        const currentMode = dev.mode || "none";
        const card = document.createElement("div");
        card.className = "card";
        card.id = `card-${index}`;
        
        card.onclick = (e) => {
          if (e.target.closest('.dev-actions') || e.target.closest('.sensor-drawer')) return;
          toggleDrawer(index);
        };

        card.innerHTML = `
          <div class="card-main">
            <div class="dev-left">
              <div class="icon-box ${dev.state ? 'active' : ''}" id="icon-${index}">
                <i class="fa-solid ${dev.state ? 'fa-lightbulb' : 'fa-power-off'}"></i>
              </div>
              <div class="dev-info">
                <h3>${dev.name}</h3>
                <p><span class="status-dot"></span>${dev.ip}</p>
              </div>
            </div>
            <div class="dev-actions">
              <button class="btn-toggle ${dev.state ? 'btn-on' : 'btn-off'}" id="btn-toggle-${index}" onclick="event.stopPropagation(); toggleDevice(${index});">
                ${dev.state ? 'ON' : 'OFF'}
              </button>
              <button class="btn-del" onclick="event.stopPropagation(); deleteDevice(${index});">✕</button>
            </div>
          </div>

          <div class="hint-label">${isOpen ? '▲ Collapse options' : '▼ Tap card to open AI & sensor modes'}</div>
          
          <div class="sensor-drawer ${isOpen ? 'open' : ''}">
            <div class="drawer-title">
              <i class="fa-solid fa-brain"></i> Neural AI & Gesture Modes
            </div>
            <select onclick="event.stopPropagation();" onchange="handleModeChange(${index}, this.value)">
              <option value="none" ${currentMode === 'none' ? 'selected' : ''}>Standard Manual Mode</option>
              <option value="neural-clap" ${currentMode === 'neural-clap' ? 'selected' : ''}>TF.js Neural Classifier (Claps Only)</option>
              <option value="shake" ${currentMode === 'shake' ? 'selected' : ''}>Gesture: Shake Phone (Acc > 11g)</option>
              <option value="wrist" ${currentMode === 'wrist' ? 'selected' : ''}>Gesture: Wrist Flick (Gyro/Tilt)</option>
              <option value="voice" ${currentMode === 'voice' ? 'selected' : ''}>Voice: "Lights ON" / "Lights OFF"</option>
              <option value="flicker" ${currentMode === 'flicker' ? 'selected' : ''}>DIY: Auto-Strobe Cycle (500ms)</option>
            </select>

            <div class="meter-container" id="meter-box-${index}" style="display: ${currentMode === 'neural-clap' ? 'block' : 'none'};">
              <div class="meter-bar" id="meter-bar-${index}"></div>
              <div class="meter-threshold-line" title="75% Clap Match Threshold"></div>
            </div>
            
            <div class="sensor-feedback" id="feedback-${index}">
              <i class="fa-solid fa-robot"></i> <span>Ready</span>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function openModal() { document.getElementById("pairModal").style.display = "flex"; }
    function closeModal() { document.getElementById("pairModal").style.display = "none"; }

    function addDevice() {
      const name = document.getElementById("devName").value.trim();
      const ip = document.getElementById("devIp").value.trim();
      if (!name || !ip) return alert("Fill in both fields.");
      devices.push({ name, ip, state: false, mode: "none" });
      saveState();
      render();
      closeModal();
    }

    // Direct UI DOM mutation: Toggles switch state WITHOUT wiping out the page or audio loop
    function updateDeviceUI(index, state) {
      const btn = document.getElementById(`btn-toggle-${index}`);
      const iconBox = document.getElementById(`icon-${index}`);
      if (btn) {
        btn.className = `btn-toggle ${state ? 'btn-on' : 'btn-off'}`;
        btn.innerText = state ? 'ON' : 'OFF';
      }
      if (iconBox) {
        iconBox.className = `icon-box ${state ? 'active' : ''}`;
        iconBox.innerHTML = `<i class="fa-solid ${state ? 'fa-lightbulb' : 'fa-power-off'}"></i>`;
      }
    }

    function sendCommand(index, state) {
      const dev = devices[index];
      dev.state = state;
      saveState();
      updateDeviceUI(index, state); // Instant visual update without re-rendering the whole page
      if (navigator.vibrate) navigator.vibrate(60);
      fetch(`http://${dev.ip}/toggle?state=${state ? 1 : 0}`, { mode: 'cors' }).catch(() => {});
    }

    function toggleDevice(index) {
      sendCommand(index, !devices[index].state);
    }

    function deleteDevice(index) {
      const dev = devices[index];
      if (confirm(`Reset and erase Wi-Fi on ${dev.name}?`)) {
        fetch(`http://${dev.ip}/resetwifi`, { mode: 'cors' }).catch(() => {});
        devices.splice(index, 1);
        saveState();
        render();
      }
    }

    // --- NEURAL NETWORK AUDIO PROCESSOR & SENSORS ---
    async function handleModeChange(index, mode) {
      // Save chosen mode directly to the device object
      devices[index].mode = mode;
      saveState();

      const feedback = document.getElementById(`feedback-${index}`);
      const meterBox = document.getElementById(`meter-box-${index}`);
      const meterBar = document.getElementById(`meter-bar-${index}`);
      
      window.ondevicemotion = null;
      if (diyIntervals[index]) clearInterval(diyIntervals[index]);
      if (animFrame) cancelAnimationFrame(animFrame);

      if (meterBox) meterBox.style.display = "none";

      if (mode === "none") {
        if (feedback) feedback.style.display = "none";
        return;
      }
      if (feedback) feedback.style.display = "flex";

      // 1. Standalone Direct TF Tensor Forward-Pass
      if (mode === "neural-clap") {
        try {
          if (meterBox) meterBox.style.display = "block";
          feedback.innerHTML = `<span class="ai-badge">AI</span> <span>Connecting microphone...</span>`;

          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') await audioCtx.resume();

          if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }

          const source = audioCtx.createMediaStreamSource(micStream);
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.08;
          source.connect(analyser);

          const freqData = new Uint8Array(analyser.frequencyBinCount);
          const timeData = new Uint8Array(analyser.fftSize);

          let prevEnergy = 0;
          let lastTrigger = 0;

          feedback.innerHTML = `<span class="ai-badge">AI Ready</span> <span>Listening for claps (shouting/noise ignored)...</span>`;

          function runInference() {
            analyser.getByteFrequencyData(freqData);
            analyser.getByteTimeDomainData(timeData);

            let lowBody = 0;
            for (let i = 1; i <= 4; i++) lowBody += freqData[i];
            lowBody = (lowBody / 4) / 255;

            let formantVowel = 0;
            for (let i = 5; i <= 13; i++) formantVowel += freqData[i];
            formantVowel = (formantVowel / 9) / 255;

            let speechMid = 0;
            for (let i = 14; i <= 22; i++) speechMid += freqData[i];
            speechMid = (speechMid / 9) / 255;

            let clapLo = 0;
            for (let i = 23; i <= 42; i++) clapLo += freqData[i];
            clapLo = (clapLo / 20) / 255;

            let clapHi = 0;
            for (let i = 43; i <= 68; i++) clapHi += freqData[i];
            clapHi = (clapHi / 26) / 255;

            const entropy = Math.min(1.0, (clapLo + clapHi) / (formantVowel + 0.05));

            let peak = 0, sumSq = 0;
            for (let i = 0; i < timeData.length; i++) {
              const dev = Math.abs(timeData[i] - 128);
              if (dev > peak) peak = dev;
              sumSq += dev * dev;
            }
            const rms = Math.sqrt(sumSq / timeData.length) || 1;
            const crest = Math.min(1.0, (peak / rms) / 8);

            const curEnergy = clapLo + clapHi;
            const deltaE = Math.max(0, Math.min(1.0, (curEnergy - prevEnergy) * 4));
            prevEnergy = curEnergy * 0.85;

            // Direct Neural MatMul Forward-Pass
            const probs = tf.tidy(() => {
              const X = tf.tensor2d([[lowBody, formantVowel, speechMid, clapLo, clapHi, entropy, crest, deltaE]]);
              const H = tf.relu(tf.add(tf.matMul(X, W1), B1));
              return tf.softmax(tf.add(tf.matMul(H, W2), B2)).dataSync();
            });

            const pVoice = probs[0];
            const pClap = probs[2];

            if (meterBar) {
              const pct = Math.round(pClap * 100);
              meterBar.style.width = `${pct}%`;
              meterBar.style.background = pClap > 0.75 ? '#10b981' : (pVoice > 0.60 ? '#ef4444' : '#38bdf8');
            }

            const now = Date.now();

            if (pClap > 0.75 && pVoice < 0.30 && (now - lastTrigger > 1100)) {
              lastTrigger = now;
              feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">MATCH</span> <span>✓ Clap Verified (${Math.round(pClap * 100)}%)</span>`;
              toggleDevice(index); // Updates state without rebuilding the page

              setTimeout(() => {
                if (feedback) {
                  feedback.innerHTML = `<span class="ai-badge">AI Ready</span> <span>Listening for claps...</span>`;
                }
              }, 900);
            }

            animFrame = requestAnimationFrame(runInference);
          }
          runInference();

        } catch (err) {
          console.error(err);
          feedback.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i> <span style="color:#ef4444;">Engine error: ${err.message || err}</span>`;
        }
      }

      // 2. Shake Gesture
      else if (mode === "shake") {
        feedback.innerHTML = `<i class="fa-solid fa-mobile-screen"></i> <span>Shake phone to toggle</span>`;
        let lastShake = 0;
        window.ondevicemotion = (e) => {
          const acc = e.accelerationIncludingGravity;
          if (!acc) return;
          const force = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z) - 9.81;
          if (force > 11.0 && Date.now() - lastShake > 1500) {
            lastShake = Date.now();
            toggleDevice(index);
          }
        };
      }

      // 3. Wrist Flick Gesture
      else if (mode === "wrist") {
        feedback.innerHTML = `<i class="fa-solid fa-hand"></i> <span>Flick wrist to toggle</span>`;
        let lastFlick = 0;
        window.ondevicemotion = (e) => {
          const acc = e.acceleration;
          if (!acc) return;
          const lateral = Math.sqrt(acc.x * acc.x + acc.y * acc.y);
          if (lateral > 14.0 && Date.now() - lastFlick > 1200) {
            lastFlick = Date.now();
            toggleDevice(index);
          }
        };
      }

      // 4. Voice Commands
      else if (mode === "voice") {
        feedback.innerHTML = `<i class="fa-solid fa-microphone"></i> <span>Say 'ON' or 'OFF'...</span>`;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return alert("Speech recognition not supported in this browser.");
        const recognizer = new SpeechRecognition();
        recognizer.continuous = true;
        recognizer.lang = 'en-US';
        recognizer.onresult = (evt) => {
          const text = evt.results[evt.results.length - 1][0].transcript.toLowerCase();
          if (text.includes("on") || text.includes("light on")) sendCommand(index, true);
          else if (text.includes("off") || text.includes("light off")) sendCommand(index, false);
        };
        recognizer.start();
      }

      // 5. DIY Auto-Strobe
      else if (mode === "flicker") {
        feedback.innerHTML = `<i class="fa-solid fa-bolt"></i> <span>Strobing every 500ms...</span>`;
        let st = false;
        diyIntervals[index] = setInterval(() => {
          st = !st;
          sendCommand(index, st);
        }, 500);
      }
    }

    render();
  </script>
</body>
</html>
